appId: com.spider.solitaire
productName: 蜘蛛纸牌
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
compression: maximum
# 打包后裁剪 Electron 运行时中本应用用不到的组件（见 scripts/afterPack.cjs）
afterPack: scripts/afterPack.cjs
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 蜘蛛纸牌
